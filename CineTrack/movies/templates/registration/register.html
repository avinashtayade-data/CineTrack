<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack Registration</title>
</head>
<body>


<h1>Create Your CineTrack Account</h1>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Register</button>
</form>

<p>Already have an account?
    <a href="{% url 'login' %}">Login here</a>
</p>


</body>
</html>
